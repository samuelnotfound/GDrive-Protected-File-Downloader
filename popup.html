<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>PDF Downloader</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="wrap">
    <div class="title">PDF Downloader</div>
    <div id="doc" class="doc">Checking page…</div>
    <div class="progress"><div id="bar"></div></div>
    <div class="row"><span id="percent">0%</span><span id="count">0 / 0</span></div>
    <div id="status" class="status">Ready</div>
    <div id="detail" class="detail">Press Start to load all pages and process the PDF.</div>
    <div class="buttons"><button id="toggle" class="primary">Start download</button></div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
